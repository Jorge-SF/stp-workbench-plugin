name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-golden:
    name: Python core + golden harness
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      # Vulcan 2026.1 ships Python 3.11 (bin/exe/python311.dll, 3.11.1), so test on 3.11.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Smoke test (stp_core imports, entry scripts, bridge launcher)
        run: python -I python/tests/smoke_test.py

      - name: Script 2 plugin mode / browser mode tests
        run: python -I python/tests/test_plugin_mode.py

      - name: Runtime folder (per-user) and web resources
        run: python -I python/tests/test_runtime.py

      - name: Golden harness (JS planner rules) matches expected/
        run: node tools/golden/run.mjs --check

      - name: Golden apply packages match Python canonical JSON
        run: python -I tools/golden/verify_canonical.py

